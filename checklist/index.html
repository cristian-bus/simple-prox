<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist de Control de Calidad (QA) - Simple ProX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #0a0f1d;
      --bg-surface: #131b2e;
      --bg-card: #1c2640;
      --bg-card-hover: #222f4f;
      --border: #2a3859;
      --border-focus: #3b82f6;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --info: #06b6d4;
      --info-bg: rgba(6, 182, 212, 0.15);
      --purple: #8b5cf6;
      --purple-bg: rgba(139, 92, 246, 0.15);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* Top Sticky Header */
    header.top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
    }

    .top-bar-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    }

    .brand-text h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-text p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .version-tag {
      font-size: 11px;
      padding: 2px 8px;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Metrics & Counters */
    .metrics-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .metric-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .metric-pill .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .metric-pill.success .dot { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .metric-pill.danger .dot { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .metric-pill.warning .dot { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
    .metric-pill.total .dot { background: var(--primary); box-shadow: 0 0 8px var(--primary); }

    .metric-val {
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
    }

    .progress-container {
      width: 160px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .progress-bar-bg {
      height: 8px;
      width: 100%;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      transition: width 0.4s ease;
      border-radius: 4px;
    }

    .progress-text {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      font-weight: 600;
    }

    /* Actions Header */
    .actions-box {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 14px;
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: transparent; border-color: var(--border); color: var(--text-main); }
    .btn-outline:hover { background: var(--bg-card); border-color: var(--text-muted); }
    .btn-danger-outline { background: transparent; border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }
    .btn-danger-outline:hover { background: var(--danger-bg); border-color: var(--danger); }

    /* Main Container */
    .container {
      max-width: 1400px;
      margin: 24px auto;
      padding: 0 24px;
    }

    /* Filter Panel */
    .filter-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .search-input-box {
      position: relative;
      flex: 1;
      min-width: 260px;
    }

    .search-input-box input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 14px 10px 38px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input-box input:focus {
      border-color: var(--primary);
    }

    .search-input-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
    }

    .filter-chips {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip:hover {
      border-color: var(--primary);
      color: var(--text-main);
    }

    .chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Section Box */
    .section-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      margin-bottom: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }

    .section-box.completed {
      border-color: rgba(16, 185, 129, 0.4);
    }

    .section-header {
      padding: 18px 24px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      user-select: none;
    }

    .section-header:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .section-title-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .section-icon-badge {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    .section-title h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .section-title p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .section-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .toggle-arrow {
      transition: transform 0.3s ease;
      color: var(--text-dim);
    }

    .section-box.collapsed .toggle-arrow {
      transform: rotate(-90deg);
    }

    .section-box.collapsed .section-content {
      display: none;
    }

    .section-content {
      padding: 16px 24px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Item Card */
    .check-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 18px;
      align-items: start;
      transition: all 0.2s ease;
    }

    .check-item:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .check-item.status-ok {
      border-left: 5px solid var(--success);
      background: rgba(16, 185, 129, 0.04);
    }

    .check-item.status-fail {
      border-left: 5px solid var(--danger);
      background: rgba(239, 68, 68, 0.05);
    }

    .check-item.status-pending {
      border-left: 5px solid var(--warning);
    }

    /* Buttons OK/Fail */
    .status-switch {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .status-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      color: var(--text-dim);
      font-weight: 700;
    }

    .status-btn.btn-ok:hover, .status-btn.btn-ok.active {
      background: var(--success);
      border-color: var(--success);
      color: white;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }

    .status-btn.btn-fail:hover, .status-btn.btn-fail.active {
      background: var(--danger);
      border-color: var(--danger);
      color: white;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
    }

    /* Item Details */
    .item-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-header {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .item-code {
      font-size: 11px;
      font-weight: 700;
      color: var(--info);
      background: var(--info-bg);
      padding: 2px 7px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
    }

    .item-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-main);
    }

    .severity-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sev-critical { background: var(--danger-bg); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .sev-high { background: var(--warning-bg); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .sev-medium { background: var(--info-bg); color: #38bdf8; border: 1px solid rgba(6, 182, 212, 0.3); }

    .tag-connection {
      font-size: 11px;
      font-weight: 600;
      color: #c084fc;
      background: var(--purple-bg);
      border: 1px solid rgba(192, 132, 252, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
    }

    .item-description {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .item-steps {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .item-steps ol, .item-steps ul {
      margin-left: 20px;
      margin-top: 4px;
      line-height: 1.6;
    }

    .item-expected {
      margin-top: 6px;
      font-size: 12px;
      color: #4ade80;
      font-weight: 500;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .item-notes-box {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }

    .item-notes-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      font-size: 12px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    .item-notes-input:focus {
      border-color: var(--primary);
    }

    .quick-status-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
    }

    .qs-ok { background: var(--success-bg); color: var(--success); }
    .qs-fail { background: var(--danger-bg); color: var(--danger); }
    .qs-pending { background: var(--warning-bg); color: var(--warning); }

    .floating-tools {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 99;
      display: flex;
      gap: 10px;
      background: rgba(19, 27, 46, 0.95);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }

    @media print {
      body { background: white !important; color: black !important; }
      header.top-bar, .filter-panel, .actions-box, .floating-tools, .item-notes-input, .status-switch { display: none !important; }
      .section-box { border: 1px solid #ccc !important; background: white !important; color: black !important; box-shadow: none !important; break-inside: avoid; margin-bottom: 20px !important; }
      .section-header { background: #f8fafc !important; color: black !important; border-bottom: 1px solid #ddd !important; }
      .check-item { background: white !important; border: 1px solid #eee !important; color: black !important; grid-template-columns: 1fr auto !important; }
      .item-title, .section-title h2 { color: black !important; }
      .item-description, .item-steps { color: #333 !important; background: #fdfdfd !important; }
      .quick-status-tag { border: 1px solid #999; }
    }
  </style>
</head>
<body>

  <!-- Top Sticky Navigation Bar -->
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="brand-box">
        <div class="brand-logo">SPX</div>
        <div class="brand-text">
          <h1>Checklist Real de Control de Calidad <span class="version-tag">Simple ProX v1.3.9</span></h1>
          <p>Auditoría Fiel al Código Fuente • POS, B2B, Inventario, Caja, Panel Admin y Offline</p>
        </div>
      </div>

      <!-- Live Counters -->
      <div class="metrics-row">
        <div class="metric-pill total" title="Total de Pruebas">
          <span class="dot"></span>
          <span>Total:</span>
          <span class="metric-val" id="count-total">0</span>
        </div>
        <div class="metric-pill success" title="Funciones Verificadas Correctas">
          <span class="dot"></span>
          <span>Aprobadas:</span>
          <span class="metric-val" id="count-ok">0</span>
        </div>
        <div class="metric-pill danger" title="Fallas Encontradas">
          <span class="dot"></span>
          <span>Fallas:</span>
          <span class="metric-val" id="count-fail">0</span>
        </div>
        <div class="metric-pill warning" title="Pruebas Pendientes">
          <span class="dot"></span>
          <span>Pendientes:</span>
          <span class="metric-val" id="count-pending">0</span>
        </div>

        <div class="progress-container">
          <div class="progress-text">
            <span>Progreso</span>
            <span id="progress-percent">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions-box">
        <button class="btn btn-outline" onclick="exportReportJSON()" title="Descargar estado en JSON para respaldar">
          💾 Exportar JSON
        </button>
        <button class="btn btn-outline" onclick="importReportJSON()" title="Restaurar estado desde JSON previo">
          📂 Cargar JSON
        </button>
        <input type="file" id="import-file-input" style="display:none;" accept=".json" onchange="handleFileSelected(event)">
        <button class="btn btn-primary" onclick="window.print()" title="Generar versión imprimible o PDF">
          🖨️ Imprimir / PDF
        </button>
        <button class="btn btn-danger-outline" onclick="resetAllChecklist()" title="Reiniciar todas las pruebas">
          🔄 Reiniciar
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">

    <!-- Filters & Search -->
    <div class="filter-panel">
      <div class="search-input-box">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input type="text" id="search-input" placeholder="Buscar función, atajo exacto (F2, F3, F4, F6, F7, F8, F12, Doble Enter)..." oninput="applyFilters()">
      </div>

      <div class="filter-chips">
        <span class="chip active" data-filter="all" onclick="setFilter('all')">Todos (<span id="chip-all-count">0</span>)</span>
        <span class="chip" data-filter="pending" onclick="setFilter('pending')">Pendientes (<span id="chip-pending-count">0</span>)</span>
        <span class="chip" data-filter="fail" onclick="setFilter('fail')">Con Fallas (<span id="chip-fail-count">0</span>)</span>
        <span class="chip" data-filter="ok" onclick="setFilter('ok')">Aprobados (<span id="chip-ok-count">0</span>)</span>
        <span class="chip" data-filter="critical" onclick="setFilter('critical')">🚨 Críticos</span>
      </div>
    </div>

    <!-- Sections wrapper -->
    <div id="sections-wrapper"></div>

  </main>

  <div class="floating-tools">
    <button class="btn btn-outline" onclick="expandAllSections()">📂 Expandir Todo</button>
    <button class="btn btn-outline" onclick="collapseAllSections()">📁 Colapsar Todo</button>
    <button class="btn btn-primary" onclick="scrollToNextPending()">⏭️ Siguiente Pendiente</button>
  </div>

  <script>
    /**
     * BASE DE DATOS DE PRUEBAS 100% FIEL AL CÓDIGO FUENTE REAL DE SIMPLE PROX
     * Refleja exactamente los atajos F reales, controles reales del carrito,
     * modales existentes y reglas implementadas.
     */
    const CHECKLIST_DATA = [
      {
        id: "sec-pos",
        title: "1. Punto de Venta (Ventas)",
        icon: "🛒",
        description: "Búsqueda por código/nombre, atajos F reales, manipulación del carrito con +/- y tacho, medios de pago y cobro.",
        items: [
          {
            id: "POS-01",
            title: "Búsqueda en Tiempo Real y Lector de Código de Barras",
            severity: "critical",
            connectedTo: "Productos -> POS",
            description: "Buscar productos mediante escritura o pistola lectora de código de barras.",
            steps: [
              "Hacer clic en el buscador superior del POS o presionar la tecla F2.",
              "Escanear un producto con lector óptico: al detectar coincidencia exacta de código (código de barras o SKU), el producto debe entrar inmediatamente al carrito y el buscador debe quedar limpio.",
              "Escribir manualmente texto: debe desplegarse el menú flotante con productos coincidentes, mostrando nombre, stock y precio.",
              "Hacer clic sobre un producto sugerido o presionar Enter: debe añadirse al carrito."
            ],
            expected: "El producto se agrega al carrito sin demoras y el buscador se limpia automáticamente para el siguiente escaneo."
          },
          {
            id: "POS-02",
            title: "Atajos de Teclado Operativos REALES (F2, F3, F4, F6, F7, F8, F9, F12, Doble Enter, ESC)",
            severity: "critical",
            connectedTo: "PuntoDeVenta.jsx (handleKeyDown)",
            description: "Comprobar los atajos de teclado exactamente como están implementados en el código de Simple ProX.",
            steps: [
              "Presionar F2: debe enfocar el buscador principal de productos (#pos-search-input) y cerrar cualquier modal abierto.",
              "Presionar F3: debe abrir / cerrar el modal de selección y búsqueda de Cliente.",
              "Presionar F4: debe abrir / cerrar el modal de 'Ítem Extra rápido' para cobrar productos no registrados.",
              "Presionar F6 (Solo Plan Pro): debe abrir / cerrar el modal de Descuentos y Recargos porcentuales o fijos.",
              "Presionar F7: debe abrir / cerrar el modal de 'Consultar Precio'.",
              "Presionar F8 (Solo Plan Pro): debe abrir / cerrar el modal de 'Alertas de Stock y Vencimiento'.",

            steps: [

            ],

          },

            steps: [

            expected: "Persistencia total de los registros comerciales."

      },
      {

          },
          {

            description: "Probar la recepción de mercadería pagada en efectivo y su posterior venta al público.",
            steps: [

          },
          {

            severity: "critical",
            connectedTo: "Inventario <-> Ofertas B2B <-> Carrito B2B <-> WhatsApp",
            description: "Probar la solución completa de reposición ante producto agotado.",
            steps: [
              "1. Vender un producto hasta que su stock quede en quiebre (≤ stock mínimo).",
              "2. Observar la sugerencia en el POS o ir a Inventario y presionar 'Reponer B2B'.",
              "3. Agregar la cantidad requerida al Carrito B2B.",
              "4. Abrir el Carrito B2B y presionar 'Enviar Pedido por WhatsApp'.",
              "5. Verificar el mensaje consolidado generado con los datos de entrega de la tienda."
            ],
            expected: "Reposición rápida con mayoristas que soluciona el quiebre de stock en segundos."
          },
          {
            id: "E2E-04",
            title: "Circuito 4: Publicar Campaña en Panel Admin -> Kiosco -> Métricas en Panel",
            severity: "critical",
            connectedTo: "Panel Admin <-> Supabase <-> Kiosco (useOfertas) <-> Métricas",
            description: "Probar el circuito publicitario completo desde la perspectiva del mayorista.",
            steps: [
              "1. Crear una campaña nueva en el Panel Admin con vigencia actual y código 'PROMO-TEST'.",
              "2. En la terminal de Simple ProX, verificar que en el siguiente ciclo de sincronización aparezca el anuncio en el banner.",
              "3. Hacer clic en el banner y presionar el botón de WhatsApp.",
              "4. Recargar el Panel Admin en 'Métricas': verificar que se contabilicen la impresión, apertura y clic en WhatsApp."
            ],
            expected: "Comprueba el modelo de negocio publicitario de punta a punta."
          },
          {
            id: "E2E-05",
            title: "Circuito 5: Prueba de Resistencia 100% Offline durante toda la jornada",
            severity: "critical",
            connectedTo: "Arquitectura Offline-First",
            description: "Probar un día entero de trabajo sin conexión a internet.",
            steps: [
              "1. Desconectar la computadora completamente de internet.",
              "2. Abrir turno, realizar múltiples ventas en efectivo y tarjeta, registrar compras y cobrar fiados.",
              "3. Cerrar el turno y generar el arqueo.",
              "4. Verificar que no haya habido ningún bloqueo o error en pantalla.",
              "5. Reconectar internet: verificar que el monitor pase a '🟢 En Línea' y los datos se sincronicen silenciosamente."
            ],
            expected: "Prueba de fuego superada: el comercio nunca se detiene aunque se caiga internet."
          }

    const STORAGE_KEY = 'kioscoprox_qa_checklist_v2';
    let checklistState = {};
    let currentFilter = 'all';

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          checklistState = JSON.parse(saved);
        }
      } catch (e) {
        console.warn('Error loading checklist state:', e);
        checklistState = {};
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(checklistState));
      } catch (e) {
        console.error('Error saving checklist state:', e);
      }
      updateStats();
    }

    function renderChecklist() {
      const wrapper = document.getElementById('sections-wrapper');
      wrapper.innerHTML = '';

      CHECKLIST_DATA.forEach((section) => {
        const sectionBox = document.createElement('div');
        sectionBox.className = 'section-box';
        sectionBox.id = `box-${section.id}`;

        const header = document.createElement('div');
        header.className = 'section-header';
        header.onclick = () => toggleSection(section.id);

        header.innerHTML = `
          <div class="section-title-group">
            <div class="section-icon-badge">${section.icon}</div>
            <div class="section-title">
              <h2>${section.title}</h2>
              <p>${section.description}</p>
            </div>
          </div>
          <div class="section-meta">
            <span class="section-badge" id="badge-${section.id}">0 / ${section.items.length}</span>
            <button class="btn btn-outline" style="padding: 4px 8px; font-size: 11px;" onclick="event.stopPropagation(); markSectionOk('${section.id}')" title="Marcar todos los ítems de esta sección como Aprobados">
              ✓ Todo OK
            </button>
            <svg class="toggle-arrow" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </div>
        `;

        const content = document.createElement('div');
        content.className = 'section-content';
        content.id = `content-${section.id}`;

        section.items.forEach(item => {
          const itemState = checklistState[item.id] || { status: 'pending', notes: '' };
          const itemCard = document.createElement('div');
          itemCard.className = `check-item status-${itemState.status}`;
          itemCard.id = `card-${item.id}`;
          itemCard.setAttribute('data-severity', item.severity);
          itemCard.setAttribute('data-status', itemState.status);

          const sevClass = item.severity === 'critical' ? 'sev-critical' : (item.severity === 'high' ? 'sev-high' : 'sev-medium');
          const sevLabel = item.severity === 'critical' ? 'Crítico' : (item.severity === 'high' ? 'Alto' : 'Medio');

          itemCard.innerHTML = `
            <div class="status-switch">
              <button class="status-btn btn-ok ${itemState.status === 'ok' ? 'active' : ''}" onclick="setItemStatus('${item.id}', 'ok')" title="Marcar como Aprobado / OK">
                ✓
              </button>
              <button class="status-btn btn-fail ${itemState.status === 'fail' ? 'active' : ''}" onclick="setItemStatus('${item.id}', 'fail')" title="Marcar como Falla / A Corregir">
                ✕
              </button>
            </div>

            <div class="item-body">
              <div class="item-header">
                <span class="item-code">${item.id}</span>
                <span class="severity-badge ${sevClass}">${sevLabel}</span>
                ${item.connectedTo ? `<span class="tag-connection">🔗 ${item.connectedTo}</span>` : ''}
                <span class="item-title">${item.title}</span>
              </div>

              <p class="item-description">${item.description}</p>

              <div class="item-steps">
                <strong>Pasos para verificar:</strong>
                <ol>
                  ${item.steps.map(st => `<li>${st}</li>`).join('')}
                </ol>
                <div class="item-expected">
                  <span>🎯</span>
                  <span><strong>Comportamiento Esperado:</strong> ${item.expected}</span>
                </div>
              </div>

              <div class="item-notes-box">
                <input 
                  type="text" 
                  class="item-notes-input" 
                  id="notes-${item.id}" 
                  placeholder="Observaciones o notas sobre la prueba (ej: 'Probado OK', 'Falla detectada:...')..." 
                  value="${escapeHtml(itemState.notes || '')}"
                  oninput="setItemNotes('${item.id}', this.value)"
                />
              </div>
            </div>

            <div style="text-align: right;">
              <span class="quick-status-tag qs-${itemState.status}" id="tag-${item.id}">
                ${itemState.status === 'ok' ? 'APROBADO' : (itemState.status === 'fail' ? 'FALLA' : 'PENDIENTE')}
              </span>
            </div>
          `;

          content.appendChild(itemCard);
        });

        sectionBox.appendChild(header);
        sectionBox.appendChild(content);
        wrapper.appendChild(sectionBox);
      });

      updateStats();
      applyFilters();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function toggleSection(secId) {
      const box = document.getElementById(`box-${secId}`);
      if (box) box.classList.toggle('collapsed');
    }

    function expandAllSections() {
      document.querySelectorAll('.section-box').forEach(b => b.classList.remove('collapsed'));
    }

    function collapseAllSections() {
      document.querySelectorAll('.section-box').forEach(b => b.classList.add('collapsed'));
    }

    function setItemStatus(itemId, newStatus) {
      if (!checklistState[itemId]) checklistState[itemId] = { status: 'pending', notes: '' };
      checklistState[itemId].status = checklistState[itemId].status === newStatus ? 'pending' : newStatus;
      checklistState[itemId].updatedAt = new Date().toISOString();
      updateItemUI(itemId);
      saveState();
    }

    function setItemNotes(itemId, notesText) {
      if (!checklistState[itemId]) checklistState[itemId] = { status: 'pending', notes: '' };
      checklistState[itemId].notes = notesText;
      checklistState[itemId].updatedAt = new Date().toISOString();
      saveState();
    }

    function updateItemUI(itemId) {
      const card = document.getElementById(`card-${itemId}`);
      if (!card) return;

      const state = checklistState[itemId] || { status: 'pending', notes: '' };
      card.className = `check-item status-${state.status}`;
      card.setAttribute('data-status', state.status);

      const btnOk = card.querySelector('.btn-ok');
      const btnFail = card.querySelector('.btn-fail');
      const tag = document.getElementById(`tag-${itemId}`);

      if (btnOk) btnOk.classList.toggle('active', state.status === 'ok');
      if (btnFail) btnFail.classList.toggle('active', state.status === 'fail');

      if (tag) {
        tag.className = `quick-status-tag qs-${state.status}`;
        tag.textContent = state.status === 'ok' ? 'APROBADO' : (state.status === 'fail' ? 'FALLA' : 'PENDIENTE');
      }
    }

    function markSectionOk(secId) {
      const section = CHECKLIST_DATA.find(s => s.id === secId);
      if (!section) return;

      section.items.forEach(item => {
        if (!checklistState[item.id]) checklistState[item.id] = { status: 'pending', notes: '' };
        checklistState[item.id].status = 'ok';
        checklistState[item.id].updatedAt = new Date().toISOString();
        updateItemUI(item.id);
      });

      saveState();
    }

    function updateStats() {
      let total = 0;
      let okCount = 0;
      let failCount = 0;
      let pendingCount = 0;

      CHECKLIST_DATA.forEach(sec => {
        let secOk = 0;
        sec.items.forEach(it => {
          total++;
          const st = checklistState[it.id]?.status || 'pending';
          if (st === 'ok') { okCount++; secOk++; }
          else if (st === 'fail') failCount++;
          else pendingCount++;
        });

        const badge = document.getElementById(`badge-${sec.id}`);
        if (badge) badge.textContent = `${secOk} / ${sec.items.length}`;
        const box = document.getElementById(`box-${sec.id}`);
        if (box) box.classList.toggle('completed', secOk === sec.items.length && sec.items.length > 0);
      });

      document.getElementById('count-total').textContent = total;
      document.getElementById('count-ok').textContent = okCount;
      document.getElementById('count-fail').textContent = failCount;
      document.getElementById('count-pending').textContent = pendingCount;

      document.getElementById('chip-all-count').textContent = total;
      document.getElementById('chip-ok-count').textContent = okCount;
      document.getElementById('chip-fail-count').textContent = failCount;
      document.getElementById('chip-pending-count').textContent = pendingCount;

      const percent = total > 0 ? Math.round((okCount / total) * 100) : 0;
      document.getElementById('progress-percent').textContent = `${percent}%`;
      document.getElementById('progress-fill').style.width = `${percent}%`;
    }

    function setFilter(filterType) {
      currentFilter = filterType;
      document.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('active', c.getAttribute('data-filter') === filterType);
      });
      applyFilters();
    }

    function applyFilters() {
      const term = (document.getElementById('search-input').value || '').toLowerCase().trim();

      document.querySelectorAll('.section-box').forEach(secBox => {
        let visibleInSec = 0;
        const items = secBox.querySelectorAll('.check-item');

        items.forEach(card => {
          const status = card.getAttribute('data-status');
          const severity = card.getAttribute('data-severity');
          const text = card.textContent.toLowerCase();

          let matchType = false;
          if (currentFilter === 'all') matchType = true;
          else if (currentFilter === 'ok' && status === 'ok') matchType = true;
          else if (currentFilter === 'fail' && status === 'fail') matchType = true;
          else if (currentFilter === 'pending' && status === 'pending') matchType = true;
          else if (currentFilter === 'critical' && severity === 'critical') matchType = true;

          const matchSearch = term === '' || text.includes(term);

          if (matchType && matchSearch) {
            card.style.display = 'grid';
            visibleInSec++;
          } else {
            card.style.display = 'none';
          }
        });

        secBox.style.display = visibleInSec > 0 ? 'block' : 'none';
      });
    }

    function scrollToNextPending() {
      const pendingItems = Array.from(document.querySelectorAll('.check-item[data-status="pending"]'));
      if (pendingItems.length === 0) {
        alert('🎉 ¡Felicitaciones! No quedan pruebas pendientes.');
        return;
      }

      for (let it of pendingItems) {
        const parentSec = it.closest('.section-box');
        if (parentSec) parentSec.classList.remove('collapsed');
        it.scrollIntoView({ behavior: 'smooth', block: 'center' });
        it.style.transition = 'outline 0.3s ease';
        it.style.outline = '3px solid #3b82f6';
        setTimeout(() => it.style.outline = 'none', 1800);
        break;
      }
    }

    function exportReportJSON() {
      const report = {
        title: "Reporte de Control de Calidad Simple ProX",
        version: "1.3.9",
        exportedAt: new Date().toISOString(),
        stats: {
          total: document.getElementById('count-total').textContent,
          ok: document.getElementById('count-ok').textContent,
          fail: document.getElementById('count-fail').textContent,
          pending: document.getElementById('count-pending').textContent,
          percent: document.getElementById('progress-percent').textContent
        },
        items: checklistState
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(report, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `QA_SimpleProX_Checklist_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importReportJSON() {
      document.getElementById('import-file-input').click();
    }

    function handleFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && parsed.items) checklistState = parsed.items;
          else if (typeof parsed === 'object') checklistState = parsed;
          saveState();
          renderChecklist();
          alert('✅ Reporte cargado exitosamente.');
        } catch (err) {
          alert('❌ El archivo seleccionado no es un JSON válido.');
        }
      };
      reader.readAsText(file);
    }

    function resetAllChecklist() {
      if (confirm('¿Estás seguro de que deseas reiniciar todos los checks a Pendiente? Se borrarán los estados y notas guardadas.')) {
        checklistState = {};
        localStorage.removeItem(STORAGE_KEY);
        renderChecklist();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderChecklist();
    });
  </script>
</body>
