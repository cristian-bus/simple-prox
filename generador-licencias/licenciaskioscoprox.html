<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Licencias - KioscoProX</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --surface-color: #1e293b;
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --success-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--surface-color);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 480px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      margin-bottom: 32px;
      font-size: 15px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: white;
      font-size: 18px;
      font-family: monospace;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-group input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    button {
      width: 100%;
      padding: 16px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:active {
      transform: translateY(2px);
    }

    .result-container {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
      display: none;
      animation: fadeIn 0.4s ease forwards;
    }

    .result-label {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .key-display {
      background-color: #0f172a;
      border: 2px dashed var(--primary-color);
      padding: 16px;
      border-radius: 12px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      font-family: monospace;
      color: var(--primary-color);
      margin-bottom: 16px;
    }

    .copy-btn {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .copy-btn:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .copy-btn.success {
      background-color: var(--success-color);
      border-color: var(--success-color);
      color: white;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">KioscoProX Admin</div>
    <div class="subtitle">Generador de Licencias PRO</div>

    <div class="input-group">
      <label for="installationId">ID de Instalación del Cliente</label>
      <input type="text" id="installationId" placeholder="Ej: ABC123XYZ" autocomplete="off" spellcheck="false">
    </div>

    <button onclick="generate()">Generar Licencia</button>

    <div class="result-container" id="resultContainer">
      <div class="result-label">Clave de Activación Generada:</div>
      <div class="key-display" id="keyDisplay">XXXX-XXXX</div>
      <button class="copy-btn" id="copyBtn" onclick="copyKey()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        <span>Copiar Clave</span>
      </button>
    </div>
  </div>

  <script>
    const SECRET_SALT = 'KioscoProX_Secret_2026';

    function generateLicenseKey(installationId) {
      if (!installationId) return '';
      let hash = 0;
      const str = installationId + SECRET_SALT;
      for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash; // Convert to 32bit integer
      }
      const hex = Math.abs(hash).toString(16).toUpperCase().padStart(8, '0');
      return `${hex.slice(0,4)}-${hex.slice(4,8)}`;
    }

    function generate() {
      const input = document.getElementById('installationId').value.trim();
      if (!input) {
        alert('Por favor, ingresa un ID de instalación válido.');
        return;
      }
      
      const key = generateLicenseKey(input);
      document.getElementById('keyDisplay').textContent = key;
      document.getElementById('resultContainer').style.display = 'block';
      
      // Reset copy button
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.className = 'copy-btn';
      copyBtn.querySelector('span').textContent = 'Copiar Clave';
    }

    function copyKey() {
      const key = document.getElementById('keyDisplay').textContent;
      navigator.clipboard.writeText(key).then(() => {
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.className = 'copy-btn success';
        copyBtn.querySelector('span').textContent = '¡Copiado!';
      }).catch(err => {
        console.error('Failed to copy: ', err);
      });
    }

    // Allow pressing Enter to generate
    document.getElementById('installationId').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        generate();
      }
    });
  </script>
</body>
</html>
